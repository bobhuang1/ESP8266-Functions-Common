sentence=A single safe String-to-char* conversion helper for display/serial APIs that require a C string.
paragraph=Many Arduino display and Serial APIs take a char* rather than a String. toCharArray()/string2char() bridges that gap without the undefined-behavior bug (missing return on empty input) present in the ad-hoc copies of this helper duplicated across earlier sketches.
